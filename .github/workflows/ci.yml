name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata and lockfile
        run: composer validate --strict
      - name: WordPress coding standards
        run: composer phpcs
      - name: PHP 7.4+ compatibility
        run: composer compat
      - name: Version consistency
        run: composer version
      - name: JavaScript syntax
        run: node --check assets/admin.js

  release-package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build release ZIP
        run: bash bin/build-release.sh
      - name: Validate ZIP structure
        run: |
          unzip -Z1 dist/mivama-media-folders.zip > /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/mivama-media-folders.php' /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/includes/class-mivama-media-folders.php' /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/readme.txt' /tmp/release-files.txt
          if grep -Eq '^mivama-media-folders/(tests|vendor|bin|\.github|composer\.json|composer\.lock)(/|$)' /tmp/release-files.txt; then
            echo 'Release ZIP contains development files.' >&2
            exit 1
          fi
      - name: Generate and verify checksum
        run: |
          sha256sum dist/mivama-media-folders.zip > dist/mivama-media-folders.zip.sha256
          sha256sum -c dist/mivama-media-folders.zip.sha256

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build release distribution
        run: bash bin/build-release.sh
      - name: Check release distribution
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/mivama-media-folders
          strict: true

  release-smoke:
    name: Release ZIP smoke test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - name: Install smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Build release ZIP
        run: bash bin/build-release.sh
      - name: Install and activate release ZIP
        env:
          DB_NAME: wordpress_smoke
          DB_USER: root
          DB_PASS: root
          DB_HOST: 127.0.0.1
          WP_VERSION: 7.1
        run: bash bin/smoke-install.sh
