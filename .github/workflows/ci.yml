name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata and lockfile
        run: composer validate --strict
      - name: WordPress coding standards
        run: composer phpcs
      - name: PHP 7.4+ compatibility
        run: composer compat
      - name: Version consistency
        run: composer version
      - name: JavaScript syntax
        run: node --check assets/admin.js

  release-package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build release ZIP
        run: bash bin/build-release.sh
      - name: Validate ZIP structure
        run: |
          unzip -Z1 dist/mivama-media-folders.zip > /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/mivama-media-folders.php' /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/includes/class-mivama-media-folders.php' /tmp/release-files.txt
          grep -Fxq 'mivama-media-folders/readme.txt' /tmp/release-files.txt
          if grep -Eq '^mivama-media-folders/(tests|vendor|bin|\.github|composer\.json|composer\.lock)(/|$)' /tmp/release-files.txt; then
            echo 'Release ZIP contains development files.' >&2
            exit 1
          fi
