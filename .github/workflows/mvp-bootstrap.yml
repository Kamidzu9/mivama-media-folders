name: MVP Bootstrap

on:
  push:
    branches:
      - fix/mvp-stabilization

permissions:
  contents: write

jobs:
  normalize:
    name: Resolve dependencies and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Resolve Composer dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Apply auto-fixable WordPress coding standards
        run: composer phpcbf || true
      - name: Commit generated lockfile and formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock mivama-media-folders.php includes tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize MVP quality baseline"
          git push
